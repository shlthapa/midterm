<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shlok Thapa</title>
</head>
<body>
<header class="mb-5 light-gray-header">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center">
      
      <!-- Left-aligned links container -->
      <div class="d-flex align-items-center">
        <a href="https://developer.mozilla.org/en-US/docs/Glossary/HTML5" class="me-3 text-decoration-none text-dark">HTML5</a>
        <a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript" class="me-3 text-decoration-none text-dark">JavaScript</a>
        <a href="https://developer.mozilla.org/en-US/docs/Web/CSS" class="text-decoration-none text-dark">CSS</a>
      </div>

      <!-- Right-aligned buttons container -->
      <div class="d-flex align-items-center">
        <div class="btn-group me-2">
          <button class="btn btn-secondary btn-sm" data-bs-theme-value="dark">Dark</button>
        </div>
        <div class="btn-group me-2">
          <button class="btn btn-light btn-sm" data-bs-theme-value="light">Light</button>
        </div>
        <button type="button" class="btn btn-secondary btn-sm">Contact Me</button>
      </div>

    </div>
  </div>
</header>

<main class="container">
  <!-- First row -->
  <div class="row mb-3">
    <div class="col-2 d-flex align-items-center fw-bold">
      Enter a number:
    </div>
    <div class="col-10 d-flex align-items-center">
      <input
        type="number"
        id="userInput"
        class="form-control"
        placeholder="Enter a number to find factorial"
      />
    </div>
  </div>
  
  <!-- Second row -->
  <div class="row">
    <div class="col-2 d-flex justify-content-end align-items-center">
      <button class="btn btn-secondary" onclick="calculateFactorial()">
        Enter
      </button>
    </div>
    <div class="col-10 d-flex align-items-center">
      <div id="output" class="output-screen p-2">
        Output will be displayed here...
      </div>
    </div>
  </div>
</main>


</body>
</html>
